<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evento Dinâmico</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="navbar"></div>
    <div class="container">
        <h1 id="titulo">Título Original</h1>
        <button id="btn1">Botão 1</button>

        <img id="imagem" src="imgs/camel.png" alt="Imagem camelo" />
        <button id="btn2">Botão 2</button>

        <p id="texto1">Texto do botão 3</p>
        <button id="btn3">Botão 3</button>

        <p id="texto2">Texto que será alterado com os botões abaixo!</p>

        <div class="btn-group">
        <button class="texto2-btn">Texto A</button>
        <button class="texto2-btn">Texto B</button>
        <button class="texto2-btn">Texto C</button>
        </div>
    </div>
    
    <div id="footer"></div>

    <script src="script.js"></script>
        <script>
        const isGitHubPages = location.hostname.includes('github.io');
        const script = document.createElement('script');
        const generalStyle = document.createElement('link');
        generalStyle.rel = "stylesheet";

        if (isGitHubPages) 
        {
            script.src = 'https://voidzinn.github.io/Linguagens-de-programacao/loadscript.js';
            generalStyle.href = 'https://voidzinn.github.io/Linguagens-de-programacao/general.css';
        }  
        else 
        {
            const depth = location.pathname.split("/").filter(s => s !== "").length - 1;
            script.src = "../".repeat(depth) + "loadscript.js";
            generalStyle.href = "../".repeat(depth) + "general.css";
        }

        document.head.appendChild(script);
        document.head.appendChild(generalStyle);
    </script>
</body>
</html>
